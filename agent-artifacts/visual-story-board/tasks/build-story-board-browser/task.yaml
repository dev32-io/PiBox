      extensions/visual-companion/story-board/tests/board-ui.test.ts
      extensions/visual-companion/story-board/tests/documents-reports-ui.test.ts
      extensions/visual-companion/tests/shell.test.ts
    - node --check extensions/visual-companion/story-board/assets/app.js
    - git diff --check
  rationale: Verify the contribution at its declared task boundary.
